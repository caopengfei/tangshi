name: Release

# 触发方式：
#   1. 推送 tag（v1.0 / v1.0.1 …）→ 构建 Release APK 并自动创建 GitHub Release
#   2. 手动 Run workflow → 只构建并上传 artifact，不发 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    # 绑定 GitHub environment：环境内同名 secret 优先于仓库级 secret；
    # 若该 environment 配了 Required reviewers，发版前需要人工批准
    environment: release
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -m1 '^val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          CODE=$(grep -m1 '^val appVersionCode' app/build.gradle.kts | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "::error::未能从 app/build.gradle.kts 解析 appVersionName / appVersionCode"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION（versionCode=$CODE）"

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 appVersionName=${{ steps.version.outputs.version }} 不一致：请先改 app/build.gradle.kts 的 appVersionCode/appVersionName 再打 tag"
            exit 1
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties 里带着本机专用的 JDK 路径与 127.0.0.1 代理，runner 上必须去掉
      - name: 清理本机专用 Gradle 配置
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          sed -i '/^systemProp\.https\?\.proxy/d' gradle.properties
          echo "--- 生效的 gradle.properties ---"
          cat gradle.properties

      # 配置了 KEYSTORE_BASE64 就用正式签名；未配置则由 app/build.gradle.kts 回退 debug 签名，
      # 并在构建后由「校验 APK 签名」步骤核对实际签名证书
      - name: 配置发布签名
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 只打印长度与别名，不泄露内容，用于定位 Secret 是否真的被注入
          echo "KEYSTORE_BASE64 长度=${#KEYSTORE_BASE64} KEYSTORE_PASSWORD 长度=${#KEYSTORE_PASSWORD} KEY_ALIAS=${KEY_ALIAS:-<空>} KEY_PASSWORD 长度=${#KEY_PASSWORD}"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，产物将回退 debug 签名（仅适合自测）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "已启用正式签名"

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assembleRelease

      - name: 收集产物并计算校验和
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 release APK"
            exit 1
          fi
          ( cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256" )
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$APK")" >> "$GITHUB_OUTPUT"
          echo "产物：$APK"

      - name: 校验 APK 签名
        id: verify
        env:
          SIGNING_ENABLED: ${{ steps.sign.outputs.enabled }}
        run: |
          APK="${{ steps.apk.outputs.dir }}/${{ steps.apk.outputs.name }}"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          DN=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate DN' || true)
          echo "apksigner: $APKSIGNER"
          echo "签名证书：$DN"
          if [ "$SIGNING_ENABLED" = "true" ]; then
            if echo "$DN" | grep -q 'CN=Android Debug'; then
              echo "::error::已配置 KEYSTORE_BASE64，产物却仍是 debug 签名：请核对 Secret（base64 是否完整，KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 是否与密钥库一致）"
              exit 1
            fi
            echo "正式签名校验通过"
          else
            echo "::warning::产物为 debug 签名（未配置 KEYSTORE_BASE64），仅适合自测，不能作为正式分发"
          fi

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.dir }}/*.apk
            ${{ steps.apk.outputs.dir }}/*.sha256
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 唐诗三百首 · TV v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            安卓 TV 发行包，下载 `${{ steps.apk.outputs.name }}` 后用 `adb install -r` 安装，或放到 U 盘在电视上安装。

            - versionName：`${{ steps.version.outputs.version }}`
            - versionCode：`${{ steps.version.outputs.code }}`
            - 校验：`sha256sum ${{ steps.apk.outputs.name }}` 对比同目录的 `.sha256` 文件
          files: |
            ${{ steps.apk.outputs.dir }}/*.apk
            ${{ steps.apk.outputs.dir }}/*.sha256
